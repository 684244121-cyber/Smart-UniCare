<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Smart UniCare - AI Chatbot</title>
    <!-- เพิ่มการดึงฟอนต์ Sarabun จาก Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background: #F4F7F9; margin: 0; }
        .chat-container { max-width: 500px; margin: 20px auto; background: white; height: 500px; border-radius: 15px; display: flex; flex-direction: column; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .messages { flex: 1; padding: 20px; overflow-y: auto; }
        .bot-msg { background: #E3F2FD; padding: 10px; border-radius: 10px; margin-bottom: 10px; font-size: 0.9rem; border-left: 4px solid #1A73E8; }
        .user-msg { text-align: right; margin-bottom: 10px; color: #1A73E8; font-weight: bold; }
        .input-area { border-top: 1px solid #eee; padding: 15px; display: flex; }
        input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 5px; font-family: 'Sarabun', sans-serif; }
        button { background: #4FC3F7; border: none; color: white; padding: 0 15px; border-radius: 5px; cursor: pointer; font-family: 'Sarabun', sans-serif; font-weight: bold; }
        button:hover { background: #29b6f6; }
    </style>
</head>
<body>
    <div style="text-align:center; margin-top:20px;"><a href="index.html" style="text-decoration:none; color:#666;">⬅ กลับหน้าหลัก</a></div>
    <div class="chat-container">
        <div class="messages" id="chat">
            <div class="bot-msg">สวัสดีครับ! ถามเรื่องทุนการศึกษาปี 68 ได้เลยครับ (เช่น ทุนปี 1, กยศ, ทุน 10,000) 🤖</div>
        </div>
        <div class="input-area">
            <!-- เพิ่ม onkeypress เพื่อให้กด Enter ได้ -->
            <input type="text" id="userInput" placeholder="พิมพ์คำถามที่นี่..." onkeypress="if(event.key === 'Enter') send()">
            <button onclick="send()">ส่ง</button>
        </div>
    </div>

    <script>
        function send() {
            const input = document.getElementById('userInput');
            const chat = document.getElementById('chat');
            if(!input.value.trim()) return;

            chat.innerHTML += `<div class="user-msg">${input.value}</div>`;
            const text = input.value.toLowerCase();
            let ans = "ขออภัยครับ ลองถามเรื่อง 'ทุนปี 1' หรือ 'กยศ' ดูนะครับ";

            if(text.includes("ปี 1") || text.includes("68")) {
                ans = "นักศึกษาปี 1 (รหัส 68) สมัคร 'ทุนเพชรราชภัฏ' ได้ครับ เป็นทุนยกเว้นค่าเล่าเรียน";
            } else if(text.includes("กยศ")) {
                ans = "กยศ. ปีการศึกษา 2568 เปิดให้ทำเรื่องแล้ว ตรวจสอบขั้นตอนได้ที่กองพัฒนานักศึกษาครับ";
            } else if(text.includes("10,000")) {
                ans = "มีทุนมูลนิธิตั้งเซ็กกิม 10,000 บาท ผ่านการประกวดเขียนเรียงความครับ";
            } else if(text.includes("ทุน")) {
                ans = "ตอนนี้มีทุนเพชรราชภัฏ, ทุนมูลนิธิตั้งเซ็กกิม และทุน กยศ. กำลังเปิดรับครับ";
            }

            setTimeout(() => {
                chat.innerHTML += `<div class="bot-msg"><b>AI:</b> ${ans}</div>`;
                chat.scrollTop = chat.scrollHeight; // ให้เลื่อนหน้าจอลงล่างสุดอัตโนมัติ
            }, 500);
            input.value = "";
        }
    </script>
</body>
</html>
